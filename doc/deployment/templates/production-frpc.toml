# frpc Production Configuration Template
# Copy to /opt/frp/config/machine-X/frpc.toml and customize

# ============================================================================
# Server Connection
# ============================================================================

# frps server address
serverAddr = "127.0.0.1"

# frps server port
serverPort = 7000

# ============================================================================
# Authentication
# ============================================================================

[auth]
# Authentication token (MUST match frps configuration)
token = "CHANGE_ME_GENERATE_STRONG_TOKEN_HERE"

# ============================================================================
# Client Configuration
# ============================================================================

# Identity
user = "machine-a"

# If loginFailExit is true, frpc will exit after first login failure
# If false, frpc will keep retrying to connect (recommended for production)
loginFailExit = false

# ============================================================================
# Logging
# ============================================================================

[log]
# Log output location: console, file
to = "/var/log/frp/frpc.log"

# Log level: trace, debug, info, warn, error
level = "info"

# Maximum days to keep log files
maxDays = 7

# Disable log timestamps when using systemd journal
disablePrintColor = false

# ============================================================================
# Transport Configuration
# ============================================================================

[transport]
# Transport protocol: tcp, kcp, quic, websocket, wss
protocol = "tcp"

# Enable DNS resolution for server address
# dnsServer = "8.8.8.8"

# TCP multiplexing (recommended, reduces connection overhead)
[transport.tcpMux]
tcpMux = true
# TCP mux keepalive interval in seconds
tcpMuxKeepaliveInterval = 60

# Heartbeat configuration
[transport.heartbeat]
# Heartbeat interval in seconds (default: 30)
interval = 30

# Heartbeat timeout in seconds (default: 90)
timeout = 90

# Dial server timeout in seconds
dialServerTimeout = 10

# Dial server keepalive in seconds
dialServerKeepAlive = 60

# ============================================================================
# TLS Configuration (Recommended for Production)
# ============================================================================

# [transport.tls]
# Enable TLS
# enable = true

# TLS cert file (for mutual TLS)
# certFile = "/etc/frp/tls/client.crt"

# TLS key file
# keyFile = "/etc/frp/tls/client.key"

# Trusted CA cert file
# trustedCaFile = "/etc/frp/tls/ca.crt"

# Server name for TLS verification
# serverName = "frps.example.com"

# Disable custom TLS first byte
# disableCustomTLSFirstByte = false

# ============================================================================
# Proxy Configuration Examples
# ============================================================================

# ----------------------------------------------------------------------------
# TCP Proxy (Single Service)
# ----------------------------------------------------------------------------

[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6000

