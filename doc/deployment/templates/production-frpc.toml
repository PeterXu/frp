# addr = "127.0.0.1"
# port = 7400
# user = "admin"
# password = "admin"

# Enable client metrics
# enablePrometheus = true

# Metadatas (sent to server plugins)
# [metadatas]
# meta1 = "value1"
# meta2 = "value2"

# ============================================================================
# Notes
# ============================================================================

# 1. After modifying this file, reload the service:
#    sudo systemctl reload frpc@machine-name
#
# 2. Proxy names must be unique within each frpc instance
#
# 3. For load balancing:
#    - All proxies in group must have same type
#    - TCP: same remotePort
#    - HTTP/HTTPS: same customDomains
#    - Must have same groupKey
#
# 4. Health check types:
#    - tcp: Port connection check
#    - http: HTTP 2xx response check
#
# 5. Security best practices:
#    - Use TLS for production
#    - Rotate secret keys regularly
#    - Limit allowUsers for STCP
#    - Monitor logs for suspicious activity
#    - Use strong passwords for HTTP auth
#
# 6. Monitoring:
#    - Enable Prometheus metrics
#    - Set up log aggregation
#    - Monitor health check failures
#    - Alert on connection issues
